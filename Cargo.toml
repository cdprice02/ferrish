[package]
name = "ferrish"
version = "0.1.0"
authors = ["Carson Price <cdprice02@users.noreply.github.com>"]
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1.0"
is_executable = "1.0"
soft-canonicalize = { version = "0.5.4", features = ["dunce"] }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cargo-tarpaulin = "0.35.1"
