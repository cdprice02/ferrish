[package]
name = "ferrish"
version = "0.1.0"
authors = ["Carson Price <cdprice02@users.noreply.github.com>"]
description = "A modern, Rust-powered shell focused on safety, performance, and a clean interactive experience."
edition = "2024"
rust-version = "1.92"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
is_executable = "1.0"
miette = { version = "7", features = ["fancy"] }
reedline = "0.47"
shlex = "1.3"
soft-canonicalize = { version = "0.5.4", features = ["dunce"] }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.24.0"
proptest = "1"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
insta = { version = "1", features = ["filters"] }
insta-cmd = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "parser"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
